# Tests for eco-engine, with the energy and carbon cost of each CI run measured by
# Eco CI (green-coding-solutions/eco-ci-energy-estimation). Results appear in the job summary.
#
# Every third-party action is pinned to a full commit SHA (supply-chain safety); the
# comment shows the release it corresponds to.

name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: eco-engine
    env:
      ECO_VISION_WARMUP: "0"        # don't load the vision models in CI
      ECO_RATE_LIMIT: "0"
      ECO_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
    steps:
      - name: Start energy measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: start-measurement

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eco-engine/requirements.txt

      - name: Install dependencies (CPU-only PyTorch keeps the download small)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Measure install
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: get-measurement
          label: "pip install"

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          # Failing tests are also published as annotations, readable on the run page.
          python -m pytest tests -p no:anyio -q -rfE --tb=line 2>&1 | tee pytest.txt || {
            grep -E "^(FAILED|ERROR) |^E  |\.py:[0-9]+: " pytest.txt | head -40 | sed 's/^/::error::/'; exit 1; }

      - name: Measure tests
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: get-measurement
          label: "pytest"

      - name: Energy and carbon summary
        if: always()
        uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        with:
          task: display-results

  # The detailed EN ISO 52016 engine (pyBuildingEnergy) only installs cleanly on Linux, and it
  # lives in the physics service: install exactly that service's requirements and run it for real.
  physics-detailed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eco-engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eco-engine/requirements/*.txt

      - name: Install the physics service dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/physics.txt pytest httpx
          pip install --no-deps -r requirements/physics-nodeps.txt

      - name: Run ISO 52016 smoke test (fails if it is skipped)
        run: |
          set -o pipefail
          python -m pytest tests/test_physics_detailed.py -p no:anyio -q -rsfE --tb=short 2>&1 | tee result.txt || {
            # Annotations are capped at 10 per step: exception lines first, then the last lines.
            { grep -E "^E +|^[A-Za-z_][A-Za-z0-9_.]*(Error|Exception)\b" result.txt | tail -n 6; tail -n 4 result.txt; } | sed 's/^/::error::/'; exit 1; }
          if grep -q "skipped" result.txt; then tail -n 10 result.txt | sed 's/^/::error::/'; exit 1; fi
