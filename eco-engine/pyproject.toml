# Used by Vercel to install the gateway only. Local development and Docker use requirements/.
# No PyTorch / Ultralytics / XGBoost here: their model weights are not deployed, and the
# gateway falls back to OpenCV photo checks and the deterministic engines without them.
[project]
name = "eco-engine"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "bcrypt>=4.1.0",
    "PyJWT>=2.15.0",
    "urllib3>=2.8.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "opencv-python-headless>=4.9",
    "pillow>=11.0",
]

[tool.uv]
package = false  # an app, not a library: install the dependencies only
